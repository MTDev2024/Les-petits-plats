<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Les Petits Plats - Trouvez rapidement la recette parfaite parmi nos 50 recettes de cuisine"
    />
    <meta name="author" content="Les Petits Plats" />
    <meta
      name="keywords"
      content="recettes, cuisine, recherche recettes, ingrédients"
    />

    <!-- Open Graph (partage réseaux sociaux) -->
    <meta
      property="og:title"
      content="Les Petits Plats - Recettes de cuisine"
    />
    <meta
      property="og:description"
      content="Trouvez rapidement la recette parfaite"
    />
    <meta property="og:type" content="website" />

    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />

    <title>Les Petits Plats - Recherche de recettes</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./css/output.css" />
  </head>
  <body class="bg-light-grey font-sans">
    <header
      class="relative bg-cover bg-center h-[667px]"
      style="
        background-image: url('./images/background/f90e7bb5ff2950597c1f7f1fce40bd5b03a3d836.jpg');
      "
    >
      <div
        class="relative z-10 container mx-auto px-4 py-8 h-full flex flex-col justify-center items-center text-center"
      >
        <div
          class="flex justify-center md:block md:absolute md:top-8 md:left-8 mb-6 md:mb-0"
        >
          <img
            src="images/logo/logo.png"
            alt="Les Petits Plats"
            class="w-32 md:w-[350px] lg:w-[180px] h-auto sm:w-[300px]"
          />
        </div>

        <!-- Phrase d'accroche -->
        <h1
          class="text-3xl md:text-4xl lg:text-[44px] font-normal mb-4 font-family-display text-primary-yellow"
        >
          CHERCHEZ PARMI PLUS DE 1500 RECETTES <br />
          DU QUOTIDIEN, SIMPLES ET DÉLICIEUSES
        </h1>

        <!-- Barre de recherche principale -->
        <div class="w-full max-w-[70%]">
          <div class="relative">
            <input
              type="text"
              id="main-search"
              placeholder="Rechercher une recette, un ingrédient, ..."
              class="w-full bg-white px-6 py-4 pr-20 rounded-lg text-gray-800 text-lg focus:outline-none focus:ring-4 focus:ring-primary-yellow shadow-lg"
            />

            <!-- Bouton de recherche -->
            <button
              type="button"
              id="search-button"
              aria-label="Lancer la recherche"
              class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-black rounded-md p-3 flex items-center justify-center hover:bg-primary-yellow active:bg-primary-yellow transition-colors cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary-yellow"
            >
              <svg
                class="w-[25px] h-[25px] text-white pointer-events-none"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                ></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main -->
    <main class="container mx-auto px-4 py-12 max-w-[1250px]">
      <section class="filters mb-12">
        <!--dropdown 1 -->
        <el-dropdown class="inline-block">
          <button
            class="inline-flex w-full gap-x-1.5 rounded-md bg-white px-3 py-2 text-base text-center font-semibold text-black inset-ring-1 inset-ring-white/5 hover:bg-primary-yellow cursor-pointer justify-between"
          >
            Ingrédients
            <svg
              viewBox="0 0 20 20"
              fill="currentColor"
              data-slot="icon"
              aria-hidden="true"
              class="-mr-1 size-5 text-black"
            >
              <path
                d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z"
                clip-rule="evenodd"
                fill-rule="evenodd"
              />
            </svg>
          </button>

          <el-menu
            anchor="bottom end"
            popover
            class="w-56 origin-top-right rounded-md bg-gray-800 outline-1 -outline-offset-1 outline-white/10 transition transition-discrete [--anchor-gap:--spacing(2)] data-closed:scale-95 data-closed:transform data-closed:opacity-0 data-enter:duration-100 data-enter:ease-out data-leave:duration-75 data-leave:ease-in"
          >
            <div class="py-1">
              <a
                href="#"
                class="block px-4 py-2 text-sm text-gray-300 focus:bg-white/5 focus:text-white focus:outline-hidden"
                >Account settings</a
              >
              <a
                href="#"
                class="block px-4 py-2 text-sm text-gray-300 focus:bg-white/5 focus:text-white focus:outline-hidden"
                >Support</a
              >
              <a
                href="#"
                class="block px-4 py-2 text-sm text-gray-300 focus:bg-white/5 focus:text-white focus:outline-hidden"
                >License</a
              >
              <form action="#" method="POST">
                <button
                  type="submit"
                  class="block w-full px-4 py-2 text-left text-sm text-gray-300 focus:bg-white/5 focus:text-white focus:outline-hidden"
                >
                  Sign out
                </button>
              </form>
            </div>
          </el-menu>
        </el-dropdown>

      </section>
      <!-- tags -->
      <section class="pb-12">
        <div
          class="tag-element bg-primary-yellow w-[10%] rounded-md justify-between font-family-sans font-normal flex"
        >
          <div class="tag-name p-3">Spatule</div>
          <span class="tag-close p-3">X</span>
        </div>
      </section>

      <!-- Template - Recipe Card -->
      <template id="recipe-card-template">
        <article
          class="bg-card-bg rounded-lg overflow-hidden max-w-[380px] border-4 border-transparent hover:border-primary-yellow cursor-pointer flex flex-col"
        >
          <div class="relative">
            <img src="" alt="" class="w-full h-[253px] object-cover" />
            <span
              class="absolute top-4 right-4 bg-primary-yellow text-text-black px-4 py-2 rounded-md text-sm font-normal font-family-sans"
            ></span>
          </div>

          <div class="p-6 flex flex-col flex-1">
            <h3
              class="font-family-display text-lg font-normal text-text-black mb-6"
            ></h3>

            <!-- Recette -->
            <div class="flex-1 mb-6">
              <h4 class="text-text-grey text-xs font-bold uppercase mb-3">
                Recette
              </h4>
              <p class="text-text-black text-sm line-clamp-6"></p>
            </div>

            <!-- Ingrédients -->
            <div>
              <h4
                class="text-text-grey text-xs font-bold uppercase tracking-wide mb-3"
              >
                Ingrédients
              </h4>
              <div class="grid grid-cols-2 gap-x-4 gap-y-3"></div>
            </div>
          </div>
        </article>
      </template>

      <!-- Conteneur  -->

      <section
        id="recipes-container"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 lg:gap-8"
      ></section>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
