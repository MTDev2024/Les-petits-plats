<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Les Petits Plats - Trouvez rapidement la recette parfaite parmi nos 50 recettes de cuisine"
    />
    <meta name="author" content="Les Petits Plats" />
    <link rel="icon" type="image/png" href="./images/favicon.png">

    <!-- Open Graph (partage réseaux sociaux) -->
    <meta
      property="og:title"
      content="Les Petits Plats - Recettes de cuisine"
    />
    <meta
      property="og:description"
      content="Trouvez rapidement la recette parfaite"
    />
    <meta property="og:type" content="website" />

    <title>Les Petits Plats - Recherche de recettes</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="css/output.css" />
  </head>

  <body class="bg-light-grey font-sans">
    <header
      class="header relative bg-cover bg-center h-[667px] bg-black"
      style="background-image: url('./images/background/bg-image.webp')"
    >
      <div
        class="header__container relative z-10 container mx-auto px-4 py-8 h-full flex flex-col justify-center items-center text-center"
      >
        <!-- Logo -->
        <div
          class="header__logo-wrapper flex justify-center md:block md:absolute md:top-8 md:left-8 mb-6 md:mb-0"
        >
          <img
            src="images/logo/Logo.png"
            alt="Les Petits Plats"
            class="header__logo w-32 md:w-[350px] lg:w-[180px] h-auto sm:w-[300px]"
          />
        </div>

        <!-- Phrase d'accroche -->
        <h1
          class="header__title text-3xl md:text-4xl lg:text-[44px] font-normal mb-4 font-family-display text-primary-yellow"
        >
          CHERCHEZ PARMI PLUS DE 1500 RECETTES <br />
          DU QUOTIDIEN, SIMPLES ET DÉLICIEUSES
        </h1>

        <!-- Barre de recherche principale -->
        <div class="search-bar w-full max-w-[70%]">
          <div class="search-bar__wrapper relative">
            <!-- Label accessible caché -->
            <label for="main-search" class="sr-only"
              >Rechercher une recette</label
            >

            <!-- Input principal -->
            <input
              type="text"
              id="main-search"
              placeholder="Rechercher une recette, un ingrédient, ..."
              class="search-bar__input w-full bg-white px-6 py-4 pr-20 rounded-lg text-gray-800 text-lg focus:outline-none focus:ring-4 focus:ring-primary-yellow placeholder-gray-800"
            />

            <!-- Bouton de recherche -->
            <button
              type="button"
              id="search-button"
              aria-label="Lancer la recherche"
              class="search-bar__button absolute right-2 top-1/2 transform -translate-y-1/2 bg-black rounded-md p-3 flex items-center justify-center hover:bg-primary-yellow active:bg-primary-yellow transition-colors cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary-yellow"
            >
              <svg
                class="search-bar__icon w-[25px] h-[25px] text-white pointer-events-none"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                ></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main -->
    <main class="container mx-auto px-4 py-12 max-w-[1250px]">
      <!-- Filtres -->
      <section class="filters flex flex-col-reverse lg:flex-row justify-between mb-4">
        <h2 class="sr-only">Filtres de recherche</h2>

        <div class="dropdowns flex flex-col mt-4 md:flex-row gap-4 md:gap-10 cursor-pointer">
          <!-- Dropdown Ingrédients -->
          <div class="ingredients-dropdown relative">
            <!-- Bouton principal -->
            <button
              class="dropdown__toggle flex items-center justify-between w-56 bg-white px-4 py-2 rounded-md font-semibold text-gray-800 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-primary-yellow"
              aria-expanded="false"
              aria-controls="dropdown-ingredients"
            >
              Ingrédients
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
                class="w-4 h-4 ml-2 transition-transform duration-200"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M19 9l-7 7-7-7"
                />
              </svg>
            </button>

            <!-- Contenu du menu -->
            <div
              id="dropdown-ingredients"
              class="dropdown__menu hidden absolute w-56 bg-white z-10 rounded-md"
            >
              <!-- Barre de recherche -->
              <div class="dropdown__search-bar relative border">
                <label for="ingredients-search" class="sr-only"
                  >Rechercher un ingrédient</label
                >
                <input
                  type="text"
                  id="ingredients-search"
                  placeholder="Rechercher..."
                  class="dropdown__search w-full px-4 py-4 text-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-primary-yellow rounded-md placeholder-gray-800"
                />
                <svg
                  class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 pointer-events-none"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                  />
                </svg>
              </div>

              <!-- Liste des ingrédients -->
              <ul
                class="ingredients-dropdown__list max-h-48 overflow-y-auto bg-white"
              ></ul>
            </div>
          </div>

          <!-- Dropdown Appareils -->
          <div class="appareils-dropdown relative">
            <!-- Bouton principal -->
            <button
              class="dropdown__toggle flex items-center justify-between w-56 bg-white px-4 py-2 rounded-md font-semibold text-gray-800 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-primary-yellow"
              aria-expanded="false"
              aria-controls="dropdown-appareils"
            >
              Appareils
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
                class="w-4 h-4 ml-2 transition-transform duration-200"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M19 9l-7 7-7-7"
                />
              </svg>
            </button>

            <!-- Contenu du menu -->
            <div
              id="dropdown-appareils"
              class="dropdown__menu hidden absolute w-56 bg-white z-10"
              role="menu"
            >
              <!-- Barre de recherche -->
              <div class="dropdown__search-bar relative border">
                <label for="appareils-search" class="sr-only"
                  >Rechercher un appareil</label
                >
                <input
                  type="text"
                  id="appareils-search"
                  placeholder="Rechercher..."
                  class="dropdown__search w-full px-4 py-4 text-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-primary-yellow rounded-md placeholder-gray-800"
                />
                <svg
                  class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 pointer-events-none"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                  />
                </svg>
              </div>

              <!-- Liste des appareils -->
              <ul
                class="appareils-dropdown__list max-h-48 overflow-y-auto bg-white"
              >
                <li>
                  <button
                    class="w-full text-left p-4 font-family-sans text-sm text-text-black font-normal hover:bg-primary-yellow focus:bg-primary-yellow focus:outline-none"
                    role="menuitem"
                  >
                    Saladier
                  </button>
                </li>
              </ul>
            </div>
          </div>

          <!-- Dropdown Ustensiles -->
          <div class="ustensiles-dropdown relative">
            <!-- Bouton principal -->
            <button
              class="dropdown__toggle flex items-center justify-between w-56 bg-white px-4 py-2 rounded-md font-semibold text-gray-800 shadow-md hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-primary-yellow"
              aria-expanded="false"
              aria-controls="dropdown-ustensiles"
            >
              Ustensiles
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
                class="w-4 h-4 ml-2 transition-transform duration-200"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M19 9l-7 7-7-7"
                />
              </svg>
            </button>

            <!-- Contenu du menu -->
            <div
              id="dropdown-ustensiles"
              class="dropdown__menu hidden absolute w-56 bg-white z-10"
              role="menu"
            >
              <!-- Barre de recherche -->
              <div class="dropdown__search-bar relative border">
                <label for="ustensiles-search" class="sr-only"
                  >Rechercher un ustensile</label
                >
                <input
                  type="text"
                  id="ustensiles-search"
                  placeholder="Rechercher..."
                  class="dropdown__search w-full px-4 py-4 text-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-primary-yellow rounded-md placeholder-gray-800"
                />
                <svg
                  class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 pointer-events-none"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                  />
                </svg>
              </div>

              <!-- Liste des ustensiles -->
              <ul
                class="ustensiles-dropdown__list max-h-48 overflow-y-auto bg-white rounded-b-md"
              >
                <li>
                  <button
                    class="w-full text-left p-4 font-family-sans text-sm text-text-black font-normal hover:bg-primary-yellow focus:bg-primary-yellow focus:outline-none"
                    role="menuitem"
                  >
                    Couteau
                  </button>
                </li>
              </ul>
            </div>
          </div>
        </div>

        <div class="recipes-total">
          <p class="font-family-display text-xl font-normal text-text-black">
            
          </p>
        </div>
      </section>

      <!-- Tags -->
      <section class="tags-display pb-12 flex gap-1.5" id="active-tags">
        <h2 class="sr-only">Mots-clés sélectionnés</h2>
        <!-- Tags actifs injectés ici -->
      </section>

      <!-- Message d'erreur -->
      <div
        id="no-results-message"
        class="mb-8 p-6 bg-gray-100 rounded-lg hidden"
      >
        <p class="text-lg text-gray-700">
          Aucune recette ne contient
          <span id="search-term" class="font-semibold"></span>.
        </p>
      </div>

      <!-- Template - Recipe Card -->
      <template id="recipe-card-template">
        <article
          class="recipe-card bg-card-bg rounded-lg overflow-hidden max-w-[380px] border-4 border-transparent hover:border-primary-yellow cursor-pointer flex flex-col"
        >
          <!-- Wrapper vide pour l'image -->
          <div class="recipe-card__image-wrapper relative">
            <span
              class="recipe-card__badge absolute top-4 right-4 bg-primary-yellow text-text-black px-4 py-2 rounded-md text-sm font-normal font-family-sans"
            ></span>
          </div>

          <div class="recipe-card__content p-6 flex flex-col flex-1">
            <h3
              class="recipe-card__title font-family-display text-lg font-normal text-text-black mb-6"
            ></h3>

            <!-- Recette -->
            <div
              class="recipe-card__section recipe-card__section--description flex-1 mb-6"
            >
              <h4 class="text-text-grey text-xs font-bold uppercase mb-3">
                Recette
              </h4>
              <p class="recipe-card__description text-text-black text-sm"></p>
            </div>

            <!-- Ingrédients -->
            <div class="recipe-card__section recipe-card__section--ingredients">
              <h4
                class="text-text-grey text-xs font-bold uppercase tracking-wide mb-3"
              >
                Ingrédients
              </h4>
              <div
                class="recipe-card__ingredients-grid grid grid-cols-2 gap-x-4 gap-y-3"
              ></div>
            </div>
          </div>
        </article>
      </template>

      <!-- Conteneur des recettes -->
      <section
        id="recipes-container"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 lg:gap-8"
      >
        <h2 class="sr-only">Liste des recettes</h2>
      </section>
    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
